[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegiscrypt"
version = "1.0.0"
description = "AegisCrypt ensures your secrets stay secure by strictly keeping keys out of your source code. By leveraging modern cryptographic primitives, it guarantees both the confidentiality and the integrity of your data."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Raj123-0"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/Raj123-0/AegisCrypt"

[tool.setuptools]
py-modules = ['AegisCrypt']
